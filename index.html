<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秋日颂歌刷播PK数据看板</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">秋日颂歌刷播PK数据看板</div>
    <div class="status">
      <span class="badge">B站数据</span>
      <span id="statusText">加载中…</span>
    </div>
    <div class="actions">
      <button id="btnRefresh" class="btn primary">刷新</button>
    </div>
  </div>

  <main>
    <!-- 左右两列 PK -->
    <section class="pk-cols" id="pkCols"></section>

    <!-- 底部趋势图（不分列） -->
    <section class="panel">
      <div class="panel-head">
        <h2>当日涨幅趋势（两家对比）</h2>
      </div>
      <div id="chart" class="chart"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
