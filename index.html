<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秋日颂歌刷播PK数据看板</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand-block">
      <div class="brand">秋日颂歌刷播PK数据看板</div>
      <div class="status">
        <span class="badge">B站数据</span>
        <span id="statusText">加载中…</span>
      </div>
    </div>
    <div class="actions">
      <button id="btnRefresh" class="btn primary">刷新</button>
    </div>
  </div>

  <main>
    <!-- 左右两列 PK -->
    <section class="pk-cols" id="pkCols"></section>

    <!-- 底部趋势图（不分列） -->
    <section class="panel">
      <div class="panel-head">
        <h2>涨幅趋势</h2>
        <div class="panel-controls">
          <select id="dateSelect" class="select" title="筛选日期"></select>
          <div class="toggle-group" id="granGroup" title="统计维度">
            <button class="toggle-btn active" data-gran="600">10分钟</button>
            <button class="toggle-btn" data-gran="1800">半小时</button>
            <button class="toggle-btn" data-gran="3600">1小时</button>
          </div>
        </div>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <!-- Excel 明细对比（每半小时） -->
    <section class="panel" id="comparePanel">
      <div class="panel-head">
        <h2>Excel 明细对比</h2>
        <div class="panel-controls">
          <div class="toggle-group" id="compareGranGroup" title="统计粒度">
            <button class="toggle-btn active" data-gran="1800">半小时</button>
            <button class="toggle-btn" data-gran="3600">1小时</button>
            <button class="toggle-btn" data-gran="7200">2小时</button>
            <button class="toggle-btn" data-gran="14400">4小时</button>
            <button class="toggle-btn" data-gran="21600">6小时</button>
            <button class="toggle-btn" data-gran="43200">12小时</button>
            <button class="toggle-btn" data-gran="86400">24小时</button>
          </div>
        </div>
      </div>
      <div id="compareTable" class="compare-table"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
